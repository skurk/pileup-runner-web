<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pileup Runner Web — standalone</title>
<style>
:root {
	--bg: #0b0e13;
	--panel: #151a22;
	--panel-2: #1c232d;
	--line: #2b3440;
	--text: #d7e0ea;
	--dim: #8fa3b5;
	--accent: #3ddc84;
	--danger: #ff5a52;
	--warn: #ffc14d;
	color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
	height: 100%;
	margin: 0;
}

body {
	background: var(--bg);
	color: var(--text);
	font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
	font-size: 14px;
	display: flex;
	flex-direction: column;
	overflow: hidden;
}

/* ---------- top bar ---------- */

.topbar {
	display: flex;
	align-items: center;
	gap: 1.5rem;
	padding: 0.5rem 1rem;
	background: var(--panel);
	border-bottom: 1px solid var(--line);
	flex: none;
}

.topbar h1 {
	font-size: 1rem;
	margin: 0;
	letter-spacing: 0.02em;
	white-space: nowrap;
}

.topbar h1 .web {
	font-size: 0.6rem;
	color: var(--accent);
	border: 1px solid var(--accent);
	border-radius: 3px;
	padding: 0 3px;
	margin-left: 5px;
	vertical-align: 2px;
}

.stats {
	display: flex;
	gap: 1.25rem;
	margin-left: auto;
}

.stat { display: flex; flex-direction: column; line-height: 1.1; }
.stat .k { font-size: 0.65rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
.stat .v { font-family: ui-monospace, monospace; font-size: 1.05rem; }
.stat .v.score { color: var(--accent); font-weight: 700; }

.actions { display: flex; gap: 0.4rem; }

button {
	font: inherit;
	color: var(--text);
	background: var(--panel-2);
	border: 1px solid var(--line);
	border-radius: 5px;
	padding: 0.35rem 0.75rem;
	cursor: pointer;
}

button:hover:not(:disabled) { background: #263040; }
button:disabled { opacity: 0.4; cursor: default; }
button.primary { background: var(--accent); color: #06220f; border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }

#btn-start {
	background: var(--accent);
	color: #06220f;
	border-color: var(--accent);
	font-weight: 700;
	box-shadow: 0 0 14px rgba(61, 220, 132, 0.4);
}

#btn-start:hover:not(:disabled) { background: #5ff2a1; }

/* Once a session is running it is no longer the thing to look at. */
#btn-start:disabled {
	background: var(--panel-2);
	color: var(--text);
	border-color: var(--line);
	font-weight: 400;
	box-shadow: none;
}

/* ---------- workspace ---------- */

.workspace {
	flex: 1;
	display: flex;
	min-height: 0;
}

.radio-panel {
	flex: 1;
	display: flex;
	min-width: 0;
	position: relative;
	background: #05070a;
}

.wf-slow { width: 150px; flex: none; height: 100%; }
.wf-scale { width: 76px; flex: none; height: 100%; }
.wf-main { flex: 1; min-width: 0; height: 100%; cursor: crosshair; }

.splitter {
	width: 5px;
	flex: none;
	background: var(--line);
	cursor: col-resize;
}

.wf-overlay {
	position: absolute;
	top: 8px;
	right: 12px;
	display: flex;
	align-items: center;
	gap: 0.6rem;
	pointer-events: none;
}

.wf-overlay > * { pointer-events: auto; }

.page-btn { padding: 0.15rem 0.5rem; font-size: 1rem; line-height: 1; }

.readout {
	display: flex;
	gap: 0.6rem;
	align-items: center;
	font-family: ui-monospace, monospace;
	background: rgba(8, 11, 15, 0.8);
	border: 1px solid var(--line);
	border-radius: 5px;
	padding: 0.25rem 0.6rem;
}

#readout-freq { font-size: 1.05rem; color: var(--accent); }
#readout-state { font-weight: 700; padding: 0 0.3rem; border-radius: 3px; }
.state-rx { color: var(--accent); }
.state-tx { color: #2a0a08; background: var(--danger); }

/* ---------- control panel ---------- */

.control-panel {
	width: 320px;
	flex: none;
	background: var(--panel);
	border-left: 1px solid var(--line);
	padding: 0.75rem;
	display: flex;
	flex-direction: column;
	gap: 0.6rem;
	overflow: hidden;
}

.call-label {
	font-size: 0.65rem;
	color: var(--dim);
	text-transform: uppercase;
	letter-spacing: 0.08em;
}

.call-input {
	font: 700 1.6rem/1 ui-monospace, monospace;
	text-transform: uppercase;
	letter-spacing: 0.08em;
	text-align: center;
	color: var(--text);
	background: #0a0d12;
	border: 1px solid var(--line);
	border-radius: 6px;
	padding: 0.5rem;
	width: 100%;
}

.call-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

.msg-grid {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: 0.3rem;
}

.msg-grid button {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 2px;
	padding: 0.35rem 0.1rem;
	font-size: 0.7rem;
}

.msg-grid button.esm-next { border-color: var(--danger); color: var(--danger); }

kbd {
	font-family: ui-monospace, monospace;
	font-size: 0.65rem;
	color: var(--dim);
	background: #0a0d12;
	border: 1px solid var(--line);
	border-radius: 3px;
	padding: 0 3px;
}

.log {
	flex: 1;
	min-height: 0;
	overflow: auto;
	background: #0d1b2e;
	border: 1px solid #1d3a5c;
	border-radius: 6px;
}

.log.competition { background: #2a0e10; border-color: #5c1d21; }

.log table { width: 100%; border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 0.75rem; }
.log th { text-align: left; color: var(--dim); font-weight: 400; padding: 0.3rem 0.4rem; position: sticky; top: 0; background: inherit; }
.log td { padding: 0.25rem 0.4rem; border-top: 1px solid rgba(255, 255, 255, 0.05); white-space: nowrap; }
.log .st-good { color: var(--accent); font-weight: 700; }
.log .st-mult { color: var(--warn); font-weight: 700; }
.log .st-bad { color: var(--danger); }
.log .correct { color: var(--danger); font-size: 0.7rem; }

.hint { margin: 0; font-size: 0.7rem; color: var(--dim); line-height: 1.7; }

/* ---------- dialogs ---------- */

dialog {
	background: var(--panel);
	color: var(--text);
	border: 1px solid var(--line);
	border-radius: 10px;
	padding: 1.25rem;
	min-width: 380px;
	max-width: 520px;
}

dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
dialog h2 { margin: 0 0 1rem; font-size: 1rem; }

dialog .grid { display: grid; gap: 0.7rem; }
dialog label { display: grid; gap: 0.25rem; font-size: 0.8rem; color: var(--dim); }
dialog label.check { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.8rem; }

dialog input[type="text"], dialog input[type="number"], dialog select {
	font: inherit;
	color: var(--text);
	background: #0a0d12;
	border: 1px solid var(--line);
	border-radius: 5px;
	padding: 0.35rem 0.5rem;
	text-transform: none;
}

dialog input[type="text"] { text-transform: uppercase; font-family: ui-monospace, monospace; }
dialog input[type="range"] { width: 100%; accent-color: var(--accent); }
dialog output { font-family: ui-monospace, monospace; color: var(--text); font-size: 0.75rem; }

dialog .modes { border: 1px solid var(--line); border-radius: 6px; margin: 1rem 0 0; padding: 0.6rem 0.8rem; }
dialog .modes legend { font-size: 0.7rem; color: var(--dim); padding: 0 0.3rem; }
dialog .modes label { display: flex; align-items: center; gap: 0.4rem; color: var(--text); }
dialog .modes small { color: var(--dim); }

dialog menu { display: flex; justify-content: flex-end; gap: 0.5rem; margin: 1.25rem 0 0; padding: 0; }

#results-body { font-family: ui-monospace, monospace; font-size: 0.85rem; line-height: 1.9; }
#results-body .big { font-size: 2rem; color: var(--accent); font-weight: 700; }
#results-body .note { font-family: inherit; font-size: 0.75rem; color: var(--dim); line-height: 1.5; }
</style>
</head>
<body>

<header class="topbar">
	<h1>Pileup&nbsp;Runner<span class="web">web</span></h1>
	<div class="stats">
		<div class="stat"><span class="k">DX</span><span class="v" id="stat-dx">—</span></div>
		<div class="stat"><span class="k">Time</span><span class="v" id="stat-time">00:00</span></div>
		<div class="stat"><span class="k">QSOs</span><span class="v" id="stat-qsos">0</span></div>
		<div class="stat"><span class="k">Score</span><span class="v score" id="stat-score">0</span></div>
	</div>
	<div class="actions">
		<button id="btn-start" type="button">Start Pileup</button>
		<button id="btn-pause" type="button" disabled>Pause</button>
		<button id="btn-stop" type="button" disabled>Stop</button>
		<button id="btn-radio" type="button">Radio…</button>
	</div>
</header>

<main class="workspace">
	<section class="radio-panel" id="radio-panel">
		<canvas id="wf-slow" class="wf-slow" title="Slow waterfall"></canvas>
		<div class="splitter" id="splitter" title="Drag to resize the slow waterfall"></div>
		<canvas id="wf-scale" class="wf-scale" title="Frequency scale — click to tune, drag to scroll"></canvas>
		<canvas id="wf-main" class="wf-main" title="Waterfall — click to tune"></canvas>
		<div class="wf-overlay">
			<button id="btn-page" class="page-btn" type="button"
				title="Left click = PageUp, right click = PageDown">⇅</button>
			<div class="readout">
				<span id="readout-freq">14025.00</span>
				<span id="readout-bw">500 Hz</span>
				<span id="readout-state" class="state-rx">RX</span>
			</div>
		</div>
	</section>

	<aside class="control-panel">
		<label class="call-label" for="call-input">Callsign</label>
		<input id="call-input" class="call-input" type="text" autocomplete="off"
			spellcheck="false" maxlength="12" placeholder="…">

		<div class="msg-grid" id="msg-grid">
			<button type="button" data-key="F1"><kbd>F1</kbd><span>QRZ</span></button>
			<button type="button" data-key="F2"><kbd>F2</kbd><span>5NN</span></button>
			<button type="button" data-key="F3"><kbd>F3</kbd><span>TU UP</span></button>
			<button type="button" data-key="F4"><kbd>F4</kbd><span>My Call</span></button>
			<button type="button" data-key="F5"><kbd>F5</kbd><span>His Call</span></button>
			<button type="button" data-key="F6"><kbd>F6</kbd><span>NIL</span></button>
			<button type="button" data-key="F7"><kbd>F7</kbd><span>AGN</span></button>
			<button type="button" id="btn-save"><kbd>↵</kbd><span>Save</span></button>
		</div>

		<div class="log" id="log-panel">
			<table>
				<thead>
					<tr><th>Time</th><th>Call</th><th>Freq</th><th>C</th><th>SNR</th><th></th></tr>
				</thead>
				<tbody id="log-body"></tbody>
			</table>
		</div>

		<p class="hint">
			<kbd>\</kbd> QRZ · <kbd>;</kbd> his call + 5NN · <kbd>.</kbd> TU UP + log<br>
			<kbd>PgUp</kbd>/<kbd>PgDn</kbd> scroll · <kbd>↑</kbd>/<kbd>↓</kbd> bandwidth · <kbd>Esc</kbd> abort
		</p>
	</aside>
</main>

<dialog id="dlg-pileup">
	<form method="dialog" id="form-pileup">
		<h2>Pileup Settings</h2>
		<div class="grid">
			<label>DX-pedition callsign<input name="dxCall" type="text" required maxlength="12"></label>
			<label>Operator's callsign<input name="opCall" type="text" maxlength="12"></label>
			<label>Number of callers
				<input name="callers" type="number" min="1" max="1000" list="caller-presets" required>
				<datalist id="caller-presets">
					<option value="10"></option><option value="30"></option>
					<option value="100"></option><option value="300"></option><option value="1000"></option>
				</datalist>
			</label>
			<label>Average SNR, dB<input name="snrDb" type="number" min="3" max="30" required></label>
			<label>Difficult continent
				<select name="difficult">
					<option value="AS">AS</option><option value="EU">EU</option><option value="NA">NA</option>
				</select>
			</label>
			<label>Session length, min<input name="minutes" type="number" min="1" max="120" required></label>
		</div>
		<fieldset class="modes">
			<legend>Mode</legend>
			<label><input type="radio" name="mode" value="practice"> Practice</label>
			<label><input type="radio" name="mode" value="competition"> Competition <small>(100 callers, 15 dB, 15 min)</small></label>
		</fieldset>
		<menu>
			<button value="cancel" type="submit" class="ghost">Cancel</button>
			<button value="ok" type="submit" class="primary">Start</button>
		</menu>
	</form>
</dialog>

<dialog id="dlg-radio">
	<form method="dialog" id="form-radio">
		<h2>Radio &amp; Keyer</h2>
		<div class="grid">
			<label>CW pitch, Hz<input name="pitch" type="range" min="300" max="1000" step="10"><output></output></label>
			<label>Filter bandwidth, Hz<input name="bandwidth" type="range" min="100" max="3000" step="50"><output></output></label>
			<label>AF gain<input name="afGain" type="range" min="0" max="1" step="0.01"><output></output></label>
			<label>Sidetone gain<input name="sidetoneGain" type="range" min="0" max="1" step="0.01"><output></output></label>
			<label>Keyer speed, WPM<input name="wpm" type="range" min="15" max="45" step="1"><output></output></label>
			<label>Auto DX call every N-th QSO<input name="autoDxCallEvery" type="number" min="1" max="10"></label>
		</div>
		<label class="check"><input type="checkbox" name="esm"> ESM — Enter Sends Message</label>
		<menu><button value="ok" type="submit" class="primary">Close</button></menu>
	</form>
</dialog>

<dialog id="dlg-results">
	<h2>Session Result</h2>
	<div id="results-body"></div>
	<menu>
		<button type="button" id="btn-adif" class="ghost">Download ADIF</button>
		<button type="button" id="btn-history" class="ghost">Download history</button>
		<button type="button" id="btn-results-close" class="primary">Close</button>
	</menu>
</dialog>

<script id="pileup-processor-src" type="text/worklet-source">
// AudioWorklet processor: synthesises the pileup as a complex I/Q stream, then
// receives it through a real DSP chain (tune -> decimate -> filter -> AGC).
// Self-contained: AudioWorklet global scope has no module imports.

const SAMPLE_RATE = 48000;
const FFT_SIZE = 2048;
const HOP = 480;
const DECIM = 4;
const NOISE_SIGMA = 0.01;
const REF_BW = 500; // SNR reference bandwidth
const MAX_ACTIVE_TX = 256;
const ENV_TAU = 0.0015; // key envelope time constant (click shaping)
const TX_BURST_GAP = 0.8; // messages closer than this stay one transmission

/* ---------- FFT ---------- */

class FFT {
  constructor(n) {
    this.n = n;
    this.cos = new Float32Array(n / 2);
    this.sin = new Float32Array(n / 2);
    for (let i = 0; i < n / 2; i++) {
      this.cos[i] = Math.cos((-2 * Math.PI * i) / n);
      this.sin[i] = Math.sin((-2 * Math.PI * i) / n);
    }
    this.rev = new Uint16Array(n);
    const bits = Math.log2(n);
    for (let i = 0; i < n; i++) {
      let x = i;
      let r = 0;
      for (let b = 0; b < bits; b++) {
        r = (r << 1) | (x & 1);
        x >>= 1;
      }
      this.rev[i] = r;
    }
  }

  transform(re, im) {
    const { n, rev, cos, sin } = this;
    for (let i = 0; i < n; i++) {
      const j = rev[i];
      if (j > i) {
        let t = re[i]; re[i] = re[j]; re[j] = t;
        t = im[i]; im[i] = im[j]; im[j] = t;
      }
    }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1;
      const step = n / size;
      for (let i = 0; i < n; i += size) {
        for (let j = i, k = 0; j < i + half; j++, k += step) {
          const c = cos[k];
          const s = sin[k];
          const tr = re[j + half] * c - im[j + half] * s;
          const ti = re[j + half] * s + im[j + half] * c;
          re[j + half] = re[j] - tr;
          im[j + half] = im[j] - ti;
          re[j] += tr;
          im[j] += ti;
        }
      }
    }
  }
}

/* ---------- FIR design ---------- */

function designLowpass(numTaps, cutoffNorm) {
  const h = new Float32Array(numTaps);
  const m = (numTaps - 1) / 2;
  let sum = 0;
  for (let i = 0; i < numTaps; i++) {
    const x = i - m;
    const sinc = x === 0 ? 2 * cutoffNorm : Math.sin(2 * Math.PI * cutoffNorm * x) / (Math.PI * x);
    const w = 0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (numTaps - 1));
    h[i] = sinc * w;
    sum += h[i];
  }
  for (let i = 0; i < numTaps; i++) h[i] /= sum;
  return h;
}

class ComplexFir {
  constructor(taps) {
    this.setTaps(taps);
  }

  setTaps(taps) {
    this.h = taps;
    const n = taps.length;
    if (!this.bufI || this.bufI.length !== n) {
      this.bufI = new Float32Array(n);
      this.bufQ = new Float32Array(n);
      this.pos = 0;
    }
  }

  push(i, q) {
    this.bufI[this.pos] = i;
    this.bufQ[this.pos] = q;
    this.pos = this.pos + 1 === this.h.length ? 0 : this.pos + 1;
  }

  // Valid only right after push(); evaluates the FIR at the current instant.
  outI() {
    const { h, bufI, pos } = this;
    const n = h.length;
    let acc = 0;
    let k = pos;
    for (let t = n - 1; t >= 0; t--) {
      acc += h[t] * bufI[k];
      k = k + 1 === n ? 0 : k + 1;
    }
    return acc;
  }

  outQ() {
    const { h, bufQ, pos } = this;
    const n = h.length;
    let acc = 0;
    let k = pos;
    for (let t = n - 1; t >= 0; t--) {
      acc += h[t] * bufQ[k];
      k = k + 1 === n ? 0 : k + 1;
    }
    return acc;
  }
}

/* ---------- Processor ---------- */

class PileupProcessor extends AudioWorkletProcessor {
  constructor() {
    super();

    this.running = false;
    this.renormCount = 0;
    this.slots = new Map();

    this.rxFreq = 2000;
    this.bandwidth = 500;
    this.pitch = 600;
    this.afGain = 0.7;
    this.sidetoneGain = 0.35;

    this.loPhaseR = 1;
    this.loPhaseI = 0;
    this.pitchPhaseR = 1;
    this.pitchPhaseI = 0;

    this.decFir = new ComplexFir(designLowpass(63, 2600 / SAMPLE_RATE));
    this.decCount = 0;
    this.chanFir = new ComplexFir(designLowpass(255, 250 / (SAMPLE_RATE / DECIM)));
    this.updateChannelFilter();

    this.prevI = 0;
    this.prevQ = 0;
    this.curI = 0;
    this.curQ = 0;

    this.agcEnv = 1e-4;
    this.agcGain = 1;
    this.rxDuck = 1;

    // Transmit window. The receiver stays blanked for the whole of it,
    // including the key-up gaps between characters.
    this.txStart = 0;
    this.txEnd = 0;
    this.txWasOn = false;

    this.fft = new FFT(FFT_SIZE);
    this.fftRe = new Float32Array(FFT_SIZE);
    this.fftIm = new Float32Array(FFT_SIZE);
    this.ringI = new Float32Array(FFT_SIZE);
    this.ringQ = new Float32Array(FFT_SIZE);
    this.ringPos = 0;
    this.sinceHop = 0;
    this.window = new Float32Array(FFT_SIZE);
    for (let i = 0; i < FFT_SIZE; i++) {
      this.window[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (FFT_SIZE - 1));
    }
    this.noiseFloorDb = -60;

    this.gaussSpare = null;

    this.port.onmessage = (e) => this.handle(e.data);
  }

  handle(msg) {
    switch (msg.type) {
      case 'run':
        this.running = msg.value;
        if (!msg.value) {
          this.slots.clear();
          this.txStart = 0;
          this.txEnd = 0;
          this.txWasOn = false;
        }
        break;
      case 'rx':
        if (msg.freq !== undefined) this.rxFreq = msg.freq;
        if (msg.bandwidth !== undefined && msg.bandwidth !== this.bandwidth) {
          this.bandwidth = msg.bandwidth;
          this.updateChannelFilter();
        }
        break;
      case 'audio':
        if (msg.pitch !== undefined) this.pitch = msg.pitch;
        if (msg.afGain !== undefined) this.afGain = msg.afGain;
        if (msg.sidetoneGain !== undefined) this.sidetoneGain = msg.sidetoneGain;
        break;
      case 'tx':
        if (this.slots.size < MAX_ACTIVE_TX || msg.sidetone) {
          if (msg.sidetone) {
            let dur = 0;
            for (let i = 0; i < msg.durations.length; i++) dur += msg.durations[i];
            // A message queued back-to-back extends the current transmit window.
            if (msg.start > this.txEnd + TX_BURST_GAP) this.txStart = msg.start;
            this.txEnd = Math.max(this.txEnd, msg.start + dur);
          }
          this.slots.set(msg.id, {
            start: msg.start,
            freq: msg.freq,
            amp: msg.sidetone ? 1 : Math.sqrt((NOISE_SIGMA ** 2 * (REF_BW / SAMPLE_RATE)) * 10 ** (msg.snrDb / 10)),
            durations: msg.durations,
            sidetone: !!msg.sidetone,
            idx: 0,
            boundary: msg.durations.length ? msg.durations[0] : 0,
            elapsed: 0,
            env: 0,
            pr: 1,
            pi: 0,
          });
        }
        break;
      case 'cancel':
        this.slots.delete(msg.id);
        break;

      settings.autoDxCallEvery = Number(f.autoDxCallEvery.value);
      settings.esm = f.esm.checked;
      if (session) session.settings.wpm = settings.wpm;
      setBandwidth(Number(f.bandwidth.value));
      radio.setAudio({
        pitch: settings.pitch, afGain: settings.afGain, sidetoneGain: settings.sidetoneGain,
      });
      saveSettings();
      syncRadioOutputs();
      updateEsmHint();
    });

    el.msgGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.id === 'btn-save') writeLog(currentCall());
      else sendFKey(btn.dataset.key);
      el.callInput.focus();
    });

    el.btnResultsClose.addEventListener('click', () => el.dlgResults.close());
    el.btnAdif.addEventListener('click', () => {
      if (session) downloadText(`pileup-${new Date(wallStart).toISOString().slice(0, 10)}.adi`, toAdif(session, wallStart));
    });
    el.btnHistory.addEventListener('click', () => {
      const history = JSON.parse(localStorage.getItem(STORE_HISTORY) || '[]');
      downloadText('pileup-runner-history.txt', history.join('\n'));
    });

    el.callInput.addEventListener('input', () => {
      el.callInput.value = el.callInput.value.toUpperCase().replace(/[^A-Z0-9/]/g, '');
    });

    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('resize', () => waterfall.resize());
    attachWaterfallInput();

    requestAnimationFrame(frame);
  }

  function syncRadioOutputs() {
    for (const label of el.formRadio.querySelectorAll('label')) {
      const input = label.querySelector('input[type="range"]');
      const out = label.querySelector('output');
      if (input && out) out.value = input.value;
    }
  }

  init();
  return {  };
})();
})();
</script>
</body>
</html>
